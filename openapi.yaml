openapi: 3.0.0
info:
  title: Financial Advisor Opportunity Backend API
  description: Backend service for the financial advisor frontend.
  version: "1.0"
servers:
  - url: http://localhost:8081
    description: Development server
paths:
  /activity/fetch-meeting:
    get:
      summary: Fetch Activity
      description: Retrieves activity data for a specific lead.
      operationId: fetchActivity
      parameters:
        - name: idlead
          in: query
          required: true
          description: The ID of the lead for which activities are to be fetched.
          schema:
            type: string
            example: "c9357f00e6524ef7ba0b045dbfcfeba5"
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: Activity data retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Activity data retrieved successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        idactivity:
                          type: string
                          example: "ee527d7e2533f6dcb0587f58cdc3a684"
                        idlead:
                          type: string
                          example: "c9357f00e6524ef7ba0b045dbfcfeba5"
                        idmeta_activity:
                          type: string
                          example: "d10476cbca944b4984cf2f3237a6afd4"
                        firstname:
                          type: string
                          example: "Abhishek"
                        middlename:
                          type: string
                          nullable: true
                          example: null
                        lastname:
                          type: string
                          example: "M"
                        fullname:
                          type: string
                          example: "Abhishek M"
                        identity:
                          type: string
                          example: "5dceb723474645b1b5958eda0d97f6c2"
                        meta_data_name:
                          type: string
                          example: "Set Reminder"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "ID lead is required."

  /activity/create-meeting:
    post:
      summary: Create Activity
      description: Inserts a new activity for a specific lead.
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idLead:
                  type: string
                  example: "c9357f00e6524ef7ba0b045dbfcfeba5"
                idmetaActivity:
                  type: string
                  example: "d10476cbca944b4984cf2f3237a6afd4"
                idmetaTitleActivity:
                  type: string
                  example: "64d1ff54973d4c19a79d09e7a7a74a8a"
                activeFlag:
                  type: integer
                  example: 1
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: Activity inserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Activity inserted successfully"
                  data:
                    type: object
                    nullable: true
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /dashboard/lead-type-overview:
    get:
      summary: Get Lead Type Overview
      description: Retrieves the count of leads by type.
      operationId: getLeadTypeOverview
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsI"
      responses:
        "200":
          description: Lead counts by type retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Lead counts by type retrieved successfully"
                  data:
                    type: object
                    properties:
                      warmType:
                        type: string
                        example: "Warm"
                      warmMetaId:
                        type: string
                        example: "e685e245fb274e458280daf0ee9f0fec"
                      warmCount:
                        type: integer
                        example: 18
                      coldType:
                        type: string
                        example: "Cold"
                      coldMetaId:
                        type: string
                        example: "5ff239a9a6e04274a38acebb0e334d57"
                      coldCount:
                        type: integer
                        example: 17
                      hotType:
                        type: string
                        example: "Hot"
                      hotMetaId:
                        type: string
                        example: "b59726e1c21b4d3ab4067d08b27196b3"
                      hotCount:
                        type: integer
                        example: 16
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /dashboard/lead-status-overview:
    get:
      summary: Get Lead Status Overview
      description: Retrieves the count of leads by status.
      operationId: getLeadStatusOverview
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsI"
      responses:
        "200":
          description: Lead counts by status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Lead counts by status retrieved successfully"
                  data:
                    type: object
                    properties:
                      leadStatusRes:
                        type: array
                        items:
                          type: object
                          properties:
                            metaData:
                              type: string
                              example: "721fe429ffcb4453ba09354ed4cef3fa"
                            status:
                              type: string
                              example: "New"
                            count:
                              type: integer
                              example: 22
                            bgcolor:
                              type: string
                              example: "#EFF3FA"
                            icon:
                              type: string
                              example: "https://drive.google.com/file/d/1xcnZbMHGi-Q7310OsI-4HdRZ2JsAyl35/view?usp=drive_link"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /dashboard/get-status-wise-lead-list:
    post:
      summary: Get Leads with Pagination by Status
      description: Retrieves leads based on their status with pagination.
      operationId: getLeadsWithPagination
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: "warm"
      responses:
        "200":
          description: Leads retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Leads retrieved successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        full_name:
                          type: string
                          example: "Abhishek M"
                        mobile_no:
                          type: string
                          example: "9833220803"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /dashboard/update-lead-type:
    put:
      summary: Update Lead Type
      description: Updates the type of a lead.
      operationId: updateLeadType
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOi..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idlead:
                  type: string
                  description: Unique identifier for the lead.
                  example: "c9357f00e6524ef7ba0b045dbfcfeba5"
                idmeta_lead_type:
                  type: string
                  description: Identifier for the new lead type.
                  example: "b59726e1c21b4d3ab4067d08b27196b3"
                reason:
                  type: string
                  description: Reason for updating the lead type.
                  example: "Updating lead type for requalification"
      responses:
        "200":
          description: Lead type updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Lead type updated"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /dashboard/update-lead-status:
    put:
      summary: Update Lead Status
      description: Updates the status of a lead.
      operationId: updateLeadStatus
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOi..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idlead:
                  type: string
                  description: Unique identifier for the lead.
                  example: "c9357f00e6524ef7ba0b045dbfcfeba5"
                idmeta_lead_status:
                  type: string
                  description: Identifier for the new lead status.
                  example: "721fe429ffcb4453ba09354ed4cef3fa"
                reason:
                  type: string
                  description: Reason for updating the lead status.
                  example: "Lead status updated due to new information"
      responses:
        "200":
          description: Lead status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Lead status updated"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /activity/delete-meeting:
    delete:
      summary: Delete Activity
      description: Deletes a specific activity for a lead.
      operationId: deleteActivity
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOi..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idlead:
                  type: string
                  description: ID of the lead associated with the activity to delete.
                  example: "37e13811aceb1b601d7c2bd88ec79877"
                idactivity:
                  type: string
                  description: ID of the activity to delete.
                  example: "60816ebfc93efb14ea8bb0df0d3332d8"
      responses:
        "200":
          description: Activity deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Activity deleted successfully"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /activity/follow-up-meeting:
    post:
      summary: Create Activity
      description: Inserts a new activity for a specific lead.
      operationId: createActivity
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOi..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idLead:
                  type: string
                  description: The lead ID for which the activity is created.
                  example: "c9357f00e6524ef7ba0b045dbfcfeba5"
                idmetaActivity:
                  type: string
                  description: Metadata ID for the activity.
                  example: "d10476cbca944b4984cf2f3237a6afd4"
                idmetaTitleActivity:
                  type: string
                  description: Metadata ID for the activity title.
                  example: "64d1ff54973d4c19a79d09e7a7a74a8a"
                activeFlag:
                  type: integer
                  description: Flag indicating if the activity is active (1 for active, 0 for inactive).
                  example: 1
      responses:
        "200":
          description: Activity inserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Activity inserted successfully"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."
  
  /activity/modify-meeting:
    put:
      summary: Modify Activity
      description: Updates a specific activity for a lead.
      operationId: modifyActivity
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idactivity:
                  type: string
                  description: The ID of the activity to be modified.
                  example: "60816ebfc93efb14ea8bb0df0d3332d8"
                activity_title:
                  type: string
                  description: The title of the activity.
                  example: "64d1ff54973d4c19a79d09e7a7a74a8a"
                description:
                  type: string
                  description: A detailed description of the activity.
                  example: "something about description updated"
                activity_start_date:
                  type: string
                  format: date-time
                  description: The start date and time of the activity in ISO 8601 format.
                  example: "2024-10-29T14:50:08.986Z"
                activity_end_date:
                  type: string
                  format: date-time
                  description: The end date and time of the activity in ISO 8601 format.
                  example: "2024-10-31T14:50:08.986Z"
      responses:
        "200":
          description: Activity updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Activity updated successfully"
                  data:
                    type: string
                    description: The ID of the updated activity.
                    example: "60816ebfc93efb14ea8bb0df0d3332d8"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /activity/delete-meeting-all:
    delete:
      summary: Delete All Activities for a Lead
      description: Deletes all activities associated with a specific lead.
      operationId: deleteAllActivities
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idlead:
                  type: string
                  description: The ID of the lead whose activities will be deleted.
                  example: "37e13811aceb1b601d7c2bd88ec79877"
      responses:
        "200":
          description: Activities deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Activities deleted successfully"
                  data:
                    type: object
                    nullable: true
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /activity/fetch-diary:
    get:
      summary: Fetch Diary for a Lead
      description: Retrieves activity data associated with a specific lead.
      operationId: fetchDiary
      parameters:
        - name: idlead
          in: query
          required: true
          description: The ID of the lead for which to fetch diary entries.
          schema:
            type: string
            example: "37e13811aceb1b601d7c2bd88ec79877"
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: Activity data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Activity data retrieved successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        idlead:
                          type: string
                          description: The ID of the lead
                          example: "37e13811aceb1b601d7c2bd88ec79877"
                        idactivity:
                          type: string
                          description: The ID of the activity
                          example: "e85e3f4f645b0fe45ba107440e24c7fc"
                        activity_type:
                          type: string
                          description: Metadata ID for the activity type
                          example: "d10476cbca944b4984cf2f3237a6afd4"
                        activity_title:
                          type: string
                          description: Metadata ID for the activity title
                          example: "64d1ff54973d4c19a79d09e7a7a74a8a"
                        activity_title_name:
                          type: string
                          description: The name of the activity title
                          example: "Document Collection Reminder"
                        description:
                          type: string
                          description: Description of the activity
                          example: "something about description"
                        activity_start_date:
                          type: string
                          format: date-time
                          description: Start date of the activity
                          example: "2024-10-28T14:50:08.986Z"
                        activity_end_date:
                          type: string
                          format: date-time
                          description: End date of the activity
                          example: "2024-10-31T14:50:08.986Z"
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /activity/create-diary:
    post:
      summary: Create Diary Activity
      description: Inserts a new diary activity for a specific lead.
      operationId: createDiaryActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idLead:
                  type: string
                  description: The ID of the lead for which the diary activity is created.
                  example: "37e13811aceb1b601d7c2bd88ec79877"
                idmetaActivity:
                  type: string
                  description: Metadata ID for the activity.
                  example: "d10476cbca944b4984cf2f3237a6afd4"
                idmetaTitleActivity:
                  type: string
                  description: Metadata ID for the activity title.
                  example: "64d1ff54973d4c19a79d09e7a7a74a8a"
                startTimeStamp:
                  type: string
                  format: date-time
                  description: Start time of the activity.
                  example: "2024-10-28T20:20:08.986Z"
                endTimeStamp:
                  type: string
                  format: date-time
                  description: End time of the activity.
                  example: "2024-10-31T20:20:08.986Z"
                description:
                  type: string
                  description: Description of the activity.
                  example: "something about description"
      parameters:
        - name: authorization
          in: header
          required: true
          description: Bearer token for authorization.
          schema:
            type: string
            example: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs..."
      responses:
        "200":
          description: Activity inserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                    example: 200
                  message:
                    type: string
                    description: Status message
                    example: "Activity inserted successfully"
                  data:
                    type: object
                    nullable: true
        "401":
          description: Unauthorized - Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Unauthorized - Invalid token."
        "400":
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input data."

  /activity/modify-diary:
    put:
      summary: Modify Diary Activity
      description: Updates an existing diary activity for a specific lead.
      operationId: modifyDiaryActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idactivity:
                  type: string
                  description: The ID of the activity to be updated.
                  example: "60816ebfc93efb14ea8bb0df0d3332d8"
                activity_title:
                  type: string
                  description: Metadata ID for the activity title.
